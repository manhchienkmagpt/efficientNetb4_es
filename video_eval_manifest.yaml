# Manifest cho eval_video_level.py.
# QUAN TRỌNG: cả 5 model phải test trên CÙNG một bộ ảnh đã crop (cùng detector MTCNN hoặc SCRFD). Sửa các chỗ <ĐIỀN>.
# Chạy từ thư mục efficientNetb4_es/ (source gốc của paper). Đường dẫn tương đối tính từ đó.

output_dir: results_video_level
n_boot: 2000 # số lần bootstrap (giảm xuống 500 nếu muốn chạy nhanh để thử)
seed: 42
# batch_size: bỏ trống để dùng đúng batch_size lúc test frame-level (lấy từ config trong checkpoint)
num_workers: 4

datasets:
  # FF++ val: CHỈ dùng để chọn ngưỡng video-level (Youden). Không báo cáo trong bảng.
  - name: ffpp_val
    role: val
    type: ffpp
    root: "E:\\Deepfake_Data_Chien\\ffpp_celebdf_data\\processed\\faces\\ffpp\\c23"   # thư mục cha, script tự nối thêm split
    split: val
    expected_videos: 840 # 140 x (original + 5 phương pháp)

  - name: ffpp_test
    type: ffpp
    root: "E:\\Deepfake_Data_Chien\\ffpp_celebdf_data\\processed\\faces\\ffpp\\c23"   # thư mục cha, script tự nối thêm split
    split: test
    expected_videos: 840

  - name: celebdf
    type: cross
    root: "E:\\Deepfake_Data_Chien\\ffpp_celebdf_data\\processed\\faces\\celebdf\\test" # <ĐIỀN>
    expected_videos: 518 # 178 real + 340 fake
    label_dirs: { "0": 0, "1": 1 }   # thư mục test/0 = real, test/1 = fake

  - name: uadfv
    type: cross
    root: "F:\\DeepFakedata\\UADFV"
    expected_videos: 98 # 49 real + 49 fake
    # Nếu tên frame không theo mẫu ..._sample000001_frame000123.jpg và frame không nằm trong
    # thư mục con theo video, khai báo regex lấy video id (nhóm tên "video") từ tên file (không đuôi):
    # video_regex: "^(?P<video>.+)_\\d+$"

# checkpoint: file .pth hoặc thư mục. Nếu là thư mục, script tự chọn file .pth duy nhất không chứa gan/cross/stage_2
# (nếu có nhiều file thì script báo lỗi, khi đó ghi đường dẫn file cụ thể).
# Mỗi model: checkpoint do train.py lưu (chọn theo FF++ val), tức save_dir/checkpoint_name lúc train.
# KHÔNG dùng: best_cross.pth (train_cross.py chọn theo Celeb-DF -> leakage), *_gan.pth, *stage_2*.pth.
# Mặc định script lấy config đã lưu SẴN TRONG checkpoint (checkpoint["config"]), nên không cần khai báo config.
# Chỉ khai báo `config:` hoặc `config_overrides:` nếu checkpoint không lưu config.
# expected_frame_metrics = 5 số frame-level trong Bảng 1-3 của paper. Script tính lại và so từng số; lệch > 0.01 pp
# (paper làm tròn 2 chữ số) thì cảnh báo, nghĩa là pipeline không giống hệt lúc lấy số frame-level.
# Nếu không còn checkpoint nhưng còn CSV dự đoán từ test_origin_dataset.py / test_cross_dataset.py:
#   frames_csv: {ffpp_test: "path/origin_dataset_predictions.csv", celebdf: "path/cross_dataset_predictions.csv"}
models:
  - name: efficientnet_b4
    checkpoint: checkpoints_efficientnetb4/best_efficientnetb4.pth
    tta: false
    expected_frame_metrics:   # [Acc, AUC, F1, Prec, Rec] trong Bảng 1-3
      ffpp_test: [93.25, 95.26, 95.91, 96.87, 94.97]
      celebdf:   [70.20, 75.83, 76.08, 80.43, 72.17]
      uadfv:     [86.75, 93.48, 87.35, 82.99, 92.19]

  - name: resnet50
    checkpoint: checkpoints_resnet50/best_resnet50.pth
    tta: false
    expected_frame_metrics:   # [Acc, AUC, F1, Prec, Rec] trong Bảng 1-3
      ffpp_test: [93.39, 95.32, 96.04, 95.86, 96.22]
      celebdf:   [72.36, 76.78, 79.06, 78.65, 79.49]
      uadfv:     [84.24, 92.10, 85.06, 80.30, 90.42]

  - name: swin
    checkpoint: checkpoints_swin_small/best_swin_small.pth
    tta: false
    expected_frame_metrics:   # [Acc, AUC, F1, Prec, Rec] trong Bảng 1-3
      ffpp_test: [95.57, 97.37, 97.35, 96.97, 97.74]
      celebdf:   [73.44, 79.78, 78.96, 82.27, 75.91]
      uadfv:     [82.23, 91.98, 83.89, 76.21, 93.31]

  - name: favit
    checkpoint: checkpoints_redesigned_favit/best_redesigned_favit_mtcnn.pth # đã xác nhận: result.txt khớp paper
    tta: false
    expected_frame_metrics:   # [Acc, AUC, F1, Prec, Rec] trong Bảng 1-3
      ffpp_test: [95.79, 98.44, 97.47, 97.72, 97.21]
      celebdf:   [71.97, 80.11, 77.30, 82.52, 72.69]
      uadfv:     [85.84, 95.27, 86.69, 81.24, 92.91]

  - name: favit_cnn
    checkpoint: checkpoints_favit_freq_lite/best_favit_freq_lite_mtcnn.pth # = FA-ViT-CNN; KHÔNG dùng _stage_2
    tta: false
    expected_frame_metrics:   # [Acc, AUC, F1, Prec, Rec] trong Bảng 1-3
      ffpp_test: [96.02, 98.62, 97.63, 97.06, 98.20]
      celebdf:   [74.79, 82.65, 79.74, 84.42, 75.55]
      uadfv:     [86.33, 95.91, 87.37, 80.63, 95.34]

# Các cặp so sánh paired (DeLong ở video-level, bootstrap ở cả hai level). Cặp đầu là cặp chính của paper.
compare:
  - [favit_cnn, favit]
  - [favit_cnn, swin]
  - [favit_cnn, resnet50]
  - [favit_cnn, efficientnet_b4]
