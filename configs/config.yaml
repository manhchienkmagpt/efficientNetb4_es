data_root: "D:/chien_duy_thinh_ct7/gan_make_worse/data_training/ffpp_faces_scrfd"
train_dir: "train"
val_dir: "val"
test_dir: "test"
cross_dataset_root: "D:/chien_duy_thinh_ct7/gan_make_worse/data_training/celebdf_faces_scrfd/test"
gan_fake_dir: "F:/DeepFakedata/chien_duy_thinh_output/gan_data/generated_fake_2"
gan_real_dir: "F:/DeepFakedata/chien_duy_thinh_output/gan_data/generated_real"

image_size: 224
batch_size: 16
num_workers: 4
epochs: 30
lr: 1e-4
weight_decay: 1e-4
dropout: 0.4
pretrained: true
backbone: "redesigned_favit"  # options: efficientnetb4, resnet50, swin_tiny, swin_small, redesigned_favit, favit_freq_lite, fa_vit_swin
favit_checkpoint: null  # required for fa_vit_swin: trained redesigned_favit .pth
swin_checkpoint: null   # required for fa_vit_swin: trained swin_small .pth
freq_in_channels: 3
freq_dim: 128
use_freq: true
original_upsample_factor: null
train_real_percent: 100  # use 0-100% of original images in train_dir/original
save_dir: "checkpoints_redesigned_favit"
checkpoint_name: "best_redesigned_favit.pth"
gan_save_dir: "checkpoints_redesigned_favit"
gan_checkpoint_name: "best_redesigned_favit_gan.pth"
resume_from: null
seed: 42
threshold: 0.5
device: "cuda"

early_stopping_patience: 5
lr_scheduler_patience: 2
lr_scheduler_factor: 0.5
min_lr: 1e-7

use_pos_weight: true   # weight loss by num_real/num_fake to reduce fake-prediction bias
pos_weight: 0.5       # null = auto num_real/num_fake; set a positive number for a manual value
label_smoothing: 0.05  # soft targets: prevents overconfidence on FF++-specific features
lambda_fal: 0.0        # set > 0 to add FALoss for redesigned_favit/favit_freq_lite
fal_margin: 0.25
fal_scale: 32
